spring.application.name=cricket-live
server.port=8080

# --- XAMPP MySQL (MariaDB) ---------------------------------------------
# Default XAMPP login is user "root" with an EMPTY password.
# The database is created automatically on first run.
spring.datasource.url=jdbc:mariadb://localhost:3306/cricket_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=15

# --- JPA ----------------------------------------------------------------
# "update" creates / adjusts the tables for you. Use "validate" in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=30

# --- Live feed simulator ------------------------------------------------
# Plays one ball every interval for every match that has auto-play switched on.
cricket.simulator.enabled=true
cricket.simulator.interval-ms=1500

# --- Monitoring ---------------------------------------------------------
management.endpoints.web.exposure.include=health,info
